[project]
name = "pdfree-backend"
version = "0.1.0"
description = "LangChain agent for generating PDF books from prompts"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "langchain>=0.1.13",
    "langchain-community>=0.0.28",
    "requests>=2.31.0",
    "reportlab>=4.0.9",
    "fastapi>=0.135.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
python-version = "3.10"
